<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="home.title">BS.type — Fonderie de caractères open-source</title>
  <meta name="description" data-i18n-meta="home.description" content="BS Type, fonderie de caractères indépendante, française, open-source et à but non lucratif." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- Design tokens (couleurs, tailles, espacements) : à modifier pour changer le look global -->
  <link rel="stylesheet" href="assets/css/tokens.css?v=1790181287940" />
  <!-- Déclarations @font-face de toutes les fontes du catalogue -->
  <link rel="stylesheet" href="assets/css/fonts.css?v=1790181287940" />
  <!-- Reset + styles globaux (nav, boutons) -->
  <link rel="stylesheet" href="assets/css/base.css?v=1790181287940" />
  <!-- Composants partages avec les pages specimen : contours de module,
       menus deroulants, sliders, boutons -->
  <link rel="stylesheet" href="assets/css/specimen.css?v=1790181287940" />
  <!-- Styles spécifiques à la page d'accueil -->
  <link rel="stylesheet" href="assets/css/home.css?v=1790181287940" />

  <!-- Ecran de chargement, puis ouverture du site -->
  <script src="assets/js/boot.js?v=1790181287940"></script>
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav__brand">BS.type</a>
    <button type="button" class="nav__fonts" data-i18n="nav.fonts">Fonts</button>
  </nav>

  <!-- ======================= HERO ======================= -->
  <!-- Vidéo de fond : voir assets/landingMedia/README.txt pour la remplacer -->
  <section class="hero" id="fonts">
    <video class="hero__video" autoplay muted loop playsinline poster="assets/landingMedia/landbg-poster.jpg">
      <source src="assets/landingMedia/landbg.mp4" type="video/mp4" />
    </video>

    <!-- Pastilles orange générées depuis fonts-data.js (assets/js/render-home.js) -->
    <div class="pills"></div>

    <h1 class="hero__title">BS.type</h1>
    <p class="hero__subtitle" data-i18n="home.subtitle">Open source, independant French type foundry</p>
  </section>

  <!-- ======================= CATALOGUE ======================= -->
  <!-- Chaque fonte est ajoutée automatiquement ici depuis fonts-data.js -->
  <section class="catalog"></section>

  <!-- ======================= FONTS IN USE ======================= -->
  <section class="in-use">
    <h2 class="in-use__title" data-i18n="home.inuse">Fonts in use</h2>
    <!-- Lignes generees par render-home.js depuis inuse-data.js.
         Des div et non un tableau : chaque ligne se deplie, ce que
         la mise en page tabulaire ne permet pas proprement. -->
    <div class="in-use__list">
      <div class="in-use__head">
        <span data-i18n="home.col.name">Name</span><span data-i18n="home.col.type">Type</span><span data-i18n="home.col.date">Date</span><span data-i18n="home.col.designer">Designer</span>
      </div>
    </div>
  </section>

  <!-- Le pied de page est construit en JavaScript (voir le script
       plus bas) : un seul fichier pour toutes les pages du site. -->

  <!-- Source de données unique du catalogue -->
  <script src="assets/js/fonts-data.js?v=1790181287940"></script>
  <!-- Pied de page, le meme sur toutes les pages -->
  <script src="assets/js/footer.js?v=1790181287940"></script>
  <!-- Le logo joue par-dessus le dereglement -->
  <script src="assets/js/glitch-logo.js?v=1790181287940"></script>
  <!-- Textes de l'interface en francais / anglais (bouton FR/EN) -->
  <script src="assets/js/i18n.js?v=1790181287940"></script>
  <!-- Textes d'essai, communs a toutes les fontes -->
  <script src="assets/js/samples.js?v=1790181287940"></script>
  <!-- Metriques lues dans les fichiers de police (avant les rendus) -->
  <script src="assets/js/font-metrics.js?v=1790181287940"></script>
  <script src="assets/js/inuse-data.js?v=1790181287940"></script>
  <!-- Composants partages (slider, menus, repli glyphe manquant) -->
  <script src="assets/js/slider.js?v=1790181287940"></script>
  <script src="assets/js/popup.js?v=1790181287940"></script>
  <!-- Barre du haut : menu Fonts -->
  <script src="assets/js/nav.js?v=1790181287940"></script>
  <script src="assets/js/editor-module.js?v=1790181287940"></script>
  <script src="assets/js/glyph-fallback.js?v=1790181287940"></script>
  <!-- Injecte pastilles, catalogue et tableau depuis les données ci-dessus -->
  <script src="assets/js/render-home.js?v=1790181287940"></script>
  <!-- Vignette video de l'auteur, collee en bas a droite -->
  <script src="assets/js/faces-data.js?v=1790181287940"></script>
  <script src="assets/js/face-video.js?v=1790181287940"></script>
  <!-- Bulle « a propos », ouverte depuis la tete -->
  <script src="assets/js/about-bubble.js?v=1790181287940"></script>
  <!-- Effet de dereglement quand on ne fait rien -->
  <script src="assets/js/page-snapshot.js?v=1790181287940"></script>
  <script src="assets/js/idle-glitch.js?v=1790181287940"></script>
</body>
</html>
